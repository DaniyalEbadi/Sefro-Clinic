name: Security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  static-analysis:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit==1.*

      - name: Scan production code (fails on medium+ severity)
        run: >
          bandit -q -r accounts customers logs Sefro_Clinic
          -x "**/migrations/*" -ll

      - name: Scan tests (dummy credentials are expected, skip B105/B106/B101/B404/B603/B607)
        run: >
          bandit -q -r tests accounts/tests customers/tests
          --skip B105,B106,B101,B404,B603,B607 -ll

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.*

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --no-deps

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt --no-deps

  security-regression:
    name: Security regression suite (OWASP-mapped tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefro_clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefro_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-used-in-production
      CLINIC_ADMIN_USERNAME: sefro_admin
      CLINIC_ADMIN_PASSWORD: ci-only-password-not-used-in-production
      POSTGRES_DB: sefro_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run security test suite
        run: python manage.py test tests.security --parallel 1 --noinput

  secret-scanning:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
