name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Ruff check
        run: ruff check .

  test:
    name: Test suite + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefro_clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefro_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-used-in-production
      CLINIC_ADMIN_USERNAME: sefro_admin
      CLINIC_ADMIN_PASSWORD: ci-only-password-not-used-in-production
      POSTGRES_DB: sefro_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run full test suite with coverage
        run: coverage run --branch --source=accounts,customers,finance,inventory,logs,Sefro_Clinic,website manage.py test --parallel 1 --noinput

      - name: Enforce coverage threshold
        run: coverage report --fail-under=80

      - name: Generate coverage XML
        run: coverage xml -o coverage.xml

      - name: Verify production static collection
        run: python manage.py collectstatic --noinput

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  logic:
    name: Role-based logic tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefro_clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefro_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-used-in-production
      CLINIC_ADMIN_USERNAME: sefro_admin
      CLINIC_ADMIN_PASSWORD: ci-only-password-not-used-in-production
      POSTGRES_DB: sefro_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run role-based logic tests
        run: python manage.py test tests.logic --parallel 1 --noinput -v 0

  integration:
    name: Integration tests (wallet/checkout/customer/visit/expense/exchange)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefro_clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefro_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-used-in-production
      CLINIC_ADMIN_USERNAME: sefro_admin
      CLINIC_ADMIN_PASSWORD: ci-only-password-not-used-in-production
      POSTGRES_DB: sefro_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration suite (112 tests, incl. new wallet/checkout/customer/birthday/expense/exchange)
        run: python manage.py test tests.integration --parallel 1 --noinput -v 1

  e2e:
    name: E2E critical journeys (API E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefro_clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefro_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-used-in-production
      CLINIC_ADMIN_USERNAME: sefro_admin
      CLINIC_ADMIN_PASSWORD: ci-only-password-not-used-in-production
      POSTGRES_DB: sefro_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run E2E suite (18 tests, incl. new critical journeys)
        run: python manage.py test tests.e2e --parallel 1 --noinput -v 1

  performance:
    name: Performance regression checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefro_clinic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefro_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-used-in-production
      CLINIC_ADMIN_USERNAME: sefro_admin
      CLINIC_ADMIN_PASSWORD: ci-only-password-not-used-in-production
      POSTGRES_DB: sefro_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run performance regression tests (fast mode, now incl. finance benchmarks)
        run: python manage.py test tests.performance --parallel 1 --noinput -v 0

      - name: Collect performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: tests/performance/reports/data/

  build:
    name: Build Docker image
    needs: [lint, test, logic, integration, e2e, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build image (secrets not configured, no push)
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/se-clinic-api:latest
            ${{ env.DOCKERHUB_USERNAME }}/se-clinic-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
