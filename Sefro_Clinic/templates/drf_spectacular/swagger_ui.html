<!DOCTYPE html>
<html>
  <head>
    {% block head %}
    <title>{{ title|default:"Swagger" }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if favicon_href %}<link rel="icon" href="{{ favicon_href }}">{% endif %}
    <link rel="stylesheet" href="{{ swagger_ui_css }}">
    <style>
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *:after, *:before { box-sizing: inherit; }
      body { background: #fafafa; margin: 0; }
      .api-version-bar {
        position: fixed; top: 0; left: 0; right: 0;
        height: 50px; background: #1b6c66;
        display: flex; align-items: center; gap: 14px;
        padding: 0 18px; z-index: 9999;
      }
      .api-version-bar strong { color: #fff; font-size: 15px; }
      .api-version-bar select {
        padding: 5px 10px; border-radius: 4px;
        border: none; font-size: 14px;
      }
      .api-version-spacer { height: 50px; }
    </style>
    {% endblock head %}
  </head>
  <body>
    {% block body %}
    <div class="api-version-bar">
      <strong>Sefro Clinic API</strong>
      <select id="version-switcher" aria-label="Switch API version">
        <option value="/api/docs/">Dashboard API (financial)</option>
        <option value="/api/v2/docs/">Site API (v2)</option>
      </select>
    </div>
    <div class="api-version-spacer"></div>
    <div id="swagger-ui"></div>
    <script src="{{ swagger_ui_bundle }}"></script>
    <script src="{{ swagger_ui_standalone }}"></script>
    <script>
      (function () {
        var switcher = document.getElementById('version-switcher');
        for (var i = 0; i < switcher.options.length; i++) {
          if (switcher.options[i].value === window.location.pathname) {
            switcher.selectedIndex = i;
            break;
          }
        }
        switcher.addEventListener('change', function () {
          if (this.value) { window.location = this.value; }
        });
      })();
    </script>
    {% if script_url %}
    <script src="{{ script_url }}"></script>
    {% else %}
    <script>
    {% include template_name_js %}
    </script>
    {% endif %}
    {% endblock %}
  </body>
</html>
