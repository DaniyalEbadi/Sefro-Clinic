services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sefro_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sefro_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_JWT_COOKIE_SECURE: ${DJANGO_JWT_COOKIE_SECURE:-False}
      DJANGO_DOCS_PUBLIC: ${DJANGO_DOCS_PUBLIC:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      THROTTLE_AUTH_RATE: ${THROTTLE_AUTH_RATE:-10/min}
      POSTGRES_DB: ${POSTGRES_DB:-sefro_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CLINIC_ADMIN_USERNAME: ${CLINIC_ADMIN_USERNAME:?set CLINIC_ADMIN_USERNAME in .env}
      CLINIC_ADMIN_PASSWORD: ${CLINIC_ADMIN_PASSWORD:?set CLINIC_ADMIN_PASSWORD in .env}
    ports:
      # Bound to loopback only: put nginx/Caddy (TLS) on the host in front of this.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
